<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SentryOS Admin</title>
    <script>
      // Apply the persisted theme before first paint so the page never flashes the wrong
      // background. Dark is the product default.
      (function () {
        try {
          var theme = localStorage.getItem("sentryos.theme");
          document.documentElement.classList.toggle("dark", theme !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
